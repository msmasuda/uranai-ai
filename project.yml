name: Tubeworm
options:
  bundleIdPrefix: com.uranai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Tubeworm:
    type: application
    platform: iOS
    sources:
      - path: Tubeworm
    settings:
      base:
        INFOPLIST_FILE: Tubeworm/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.uranai.tubeworm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false

  TubewormTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TubewormTests
    dependencies:
      - target: Tubeworm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uranai.tubeworm.tests
        GENERATE_INFOPLIST_FILE: true
